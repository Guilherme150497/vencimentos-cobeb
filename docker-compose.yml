# Vencimentos COBEB — stack "vencimentos" no Dockhand (VM 172.16.3.247).
# Um serviço só: nginx entregando o index.html. Banco e login: Supabase (fora da VM).
services:
  web:
    container_name: cobeb-vencimentos
    image: cobeb/vencimentos:latest
    restart: unless-stopped

    # Obriga o Git deploy a reconstruir a imagem; sem isto o contêiner não pega o index.html novo.
    pull_policy: build

    build:
      context: .

    ports:
      - "${PUBLICAR_EM:-0.0.0.0}:${PORTA_EXTERNA:-8210}:80"

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "5", "http://127.0.0.1/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  default:
    name: cobeb-vencimentos-rede
